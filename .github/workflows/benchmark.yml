name: Benchmark

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmark (regular computer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Use the standard toolchain instead of the ESP toolchain in rust-toolchain.toml.
      # Keep it equal to `host_toolchain` in just/build.just.
      RUSTUP_TOOLCHAIN: "1.97"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Enable caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: benchmark
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - name: Run benchmarks
        run: just bench_all
      - name: Upload criterion report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 30
          if-no-files-found: error
      - name: Write the benchmark summary
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Benchmark results"
            echo
            echo "Commit \`$HEAD_SHA\` on a shared GitHub runner: compare trends, not single numbers."
            echo
            just bench_report
            echo
            echo "Full criterion report: the criterion-report artifact of [this run]($RUN_URL)."
          } > bench-comment.md
          cat bench-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the benchmark comment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-comment
          path: bench-comment.md
          retention-days: 1
          if-no-files-found: error

  comment:
    name: Post benchmark results
    needs: benchmark
    # Pull requests from forks get a read-only token, so they only get the job summary.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      # Needed to post the results as a pull request comment; this job runs no repository code.
      pull-requests: write
    steps:
      - name: Download the benchmark comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-comment
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr comment "$PR_NUMBER" --body-file bench-comment.md --edit-last --create-if-none
