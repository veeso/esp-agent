name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check formatting
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6
        with:
          dprint-version: 0.56.1

  quality:
    name: Quality (${{ matrix.chip }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32-S3
            suffix: s3
          - chip: ESP32-S31
            suffix: s31
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
          version: 1.97.0.0
      - name: Enable caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - name: Confirm RISC-V target and rust-src support
        run: |
          rustc --print target-list | grep -Fx riscv32imafc-unknown-none-elf
          test -d "$(rustc --print sysroot)/lib/rustlib/src/rust/library"
      - name: Update lockfile
        run: just lock
      - name: Build
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: just "build_${SUFFIX}"
      - name: Lint
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: just "clippy_${SUFFIX}" "-- -D warnings"

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
          version: 1.97.0.0
      - name: Enable caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - name: Update lockfile
        run: just lock
      - name: Build documentation
        run: just doc

  host:
    name: Build and test (regular computer)
    runs-on: ubuntu-latest
    env:
      # Use the standard toolchain instead of the ESP toolchain in rust-toolchain.toml.
      # Keep it equal to `host_toolchain` in just/build.just.
      RUSTUP_TOOLCHAIN: "1.97"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,llvm-tools-preview
      - name: Enable caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - name: Update lockfile
        run: just lock
      - name: Build
        run: just build_host
      - name: Lint benchmarks
        run: just clippy_bench "-- -D warnings"
      - name: Run tests with coverage
        run: just coverage
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: lcov.info
          format: lcov
      - name: Test benchmark report
        run: just test_bench

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
          version: 1.97.0.0
      - name: Enable caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - name: Check dependencies
        run: just deny
