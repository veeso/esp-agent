[package]
name = "semantic-search"
version.workspace = true
default-run = "semantic-search"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Example firmware: interactive semantic search over the serial console"

[features]
default = ["esp32s3"]
esp32c5 = [
  "esp-alloc/esp32c5",
  "esp-backtrace/esp32c5",
  "esp-bootloader-esp-idf/esp32c5",
  "esp-hal/esp32c5",
  "esp-println/esp32c5",
]
esp32c6 = [
  "esp-alloc/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-hal/esp32c6",
  "esp-println/esp32c6",
]
esp32p4 = [
  "esp-alloc/esp32p4",
  "esp-backtrace/esp32p4",
  "esp-bootloader-esp-idf/esp32p4",
  "esp-hal/esp32p4",
  "esp-println/esp32p4",
]
esp32s3 = [
  "esp-alloc/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-hal/esp32s3",
  "esp-println/esp32s3",
]
esp32s31 = [
  "esp-alloc/esp32s31",
  "esp-backtrace/esp32s31",
  "esp-bootloader-esp-idf/esp32s31",
  "esp-hal/esp32s31",
  "esp-println/esp32s31",
]

[dependencies]
critical-section = { workspace = true }
esp-agent = { workspace = true }
esp-alloc = { workspace = true }
esp-backtrace = { workspace = true, features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["log-04"] }
esp-hal = { workspace = true, features = ["log-04"] }
esp-println = { workspace = true, features = ["log-04"] }
log = { workspace = true }

[[bin]]
name = "home-assistant"
path = "src/home_assistant.rs"

[[bin]]
name = "semantic-search"
path = "src/main.rs"
