[package]
name = "esp-agent"
version.workspace = true
autoexamples = false
categories = [
  "artificial-intelligence",
  "embedded",
  "no-std",
  "text-processing",
]
edition.workspace = true
exclude = ["/tests/home_assistant.rs", "/tests/potion.rs"]
homepage.workspace = true
keywords = ["agent", "bare-metal", "embeddings", "esp32", "semantic-search"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
description = "Bare-metal no_std local agent for ESP32 chips (S3, S31, C5, C6, P4): on-device semantic search and command recognition with static embedding models"

[dependencies]
esp-agent-macros = { workspace = true }
# Text pipeline (no_std): sqrt for L2 normalisation, NFD + Unicode categories for the BERT normalizer.
libm = { workspace = true }
unicode-normalization = { workspace = true }
unicode-properties = { workspace = true, features = ["general-category"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
