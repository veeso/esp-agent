[package]
name = "static-models-bm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[features]
default = ["esp32s3"]
esp32s3 = [
  "esp-alloc/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-hal/esp32s3",
  "esp-println/esp32s3",
]
esp32s31 = [
  "esp-alloc/esp32s31",
  "esp-backtrace/esp32s31",
  "esp-bootloader-esp-idf/esp32s31",
  "esp-hal/esp32s31",
  "esp-println/esp32s31",
]

[dependencies]
critical-section = "1.2"
esp-alloc = "0.11"
esp-backtrace = { version = "0.20", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["log-04"] }
# Keep this on 1.2.x to match the project linker script source.
esp-hal = { version = "1.2.2, <1.3.0", features = ["log-04"] }
esp-println = { version = "0.18", features = ["log-04"] }

# Text pipeline (no_std): sqrt for L2 normalisation, NFD + Unicode categories for the BERT normalizer.
libm = { version = "0.2", default-features = false }
log = "0.4.27"
unicode-normalization = { version = "0.1", default-features = false }
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[build-dependencies]
serde_json = "1"

[[bin]]
name = "static-models-bm"
path = "./src/bin/main.rs"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2 # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
