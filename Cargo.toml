[package]
name = "esp-local-agent"
version = "0.1.0"
autoexamples = false
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/veeso/esp-local-agent"
rust-version = "1.97"
description = "Bare-metal local agent library for ESP32-S3 and ESP32-S31"

[dependencies]
# Text pipeline (no_std): sqrt for L2 normalisation, NFD + Unicode categories for the BERT normalizer.
libm = { workspace = true }
unicode-normalization = { workspace = true }
unicode-properties = { workspace = true, features = ["general-category"] }

[build-dependencies]
serde_json = { workspace = true }

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace]
members = ["examples/semantic-search"]

[workspace.dependencies]
critical-section = "1.2"
esp-alloc = "0.11"
esp-backtrace = "0.20"
esp-bootloader-esp-idf = "0.6"
# Keep this on 1.2.x to match the example linker script source.
esp-hal = "1.2.2, <1.3.0"
esp-local-agent = { path = "." }
esp-println = "0.18"
libm = { version = "0.2", default-features = false }
log = "0.4.27"
serde_json = "1"
unicode-normalization = { version = "0.1", default-features = false }
unicode-properties = { version = "0.1", default-features = false }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2 # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
